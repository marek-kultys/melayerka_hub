<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% assign page_title       = page.title | default: site.title %}
  {% assign page_description = page.description | default: site.tagline %}
  {% assign page_url         = page.url | absolute_url %}
  {% assign page_image       = site.url | append: '/assets/img/social.jpg' %}

  <title>{{ page_title }}</title>
  <meta name="description"  content="{{ page_description }}">
  <meta name="author"       content="{{ site.author }}">
  <meta name="keywords"     content="{{ page.keywords | default: site.keywords }}">
  <meta name="theme-color"  content="{{ site.theme_color }}">
  <link rel="canonical" href="{{ page_url }}">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="{{ site.title }}">
  <meta property="og:title"       content="{{ page_title }}">
  <meta property="og:description" content="{{ page_description }}">
  <meta property="og:url"         content="{{ page_url }}">
  <meta property="og:image"       content="{{ page_image }}">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="{{ page_title }}">
  <meta name="twitter:description" content="{{ page_description }}">
  <meta name="twitter:image"       content="{{ page_image }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Finlandica+Headline:ital,wght@0,100..900;1,100..900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
